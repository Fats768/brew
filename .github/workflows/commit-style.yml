name: Commit Style

on:
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  check-commit-format:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check commit format
        uses: Homebrew/actions/check-commit-format@5037c6f1012cc5ea0b9f03fedbaf9955ed9e51e0 # 2026.08.03.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          check_package_commit_format: false
