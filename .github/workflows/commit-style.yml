name: Commit Style

on:
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  check-commit-format:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check commit format
        uses: Homebrew/actions/check-commit-format@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          check_package_commit_format: false
