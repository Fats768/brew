name: Commit Style

on:
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  check-commit-format:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check commit format
        uses: Homebrew/actions/check-commit-format@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          check_package_commit_format: false
