name: Commit Style

on:
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  check-commit-format:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check commit format
        uses: Homebrew/actions/check-commit-format@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          check_package_commit_format: false
